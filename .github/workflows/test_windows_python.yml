name: Windows Unittests

on: [push, pull_request]

env:
  GST_REGISTRY: '~/registry.bin'
  KIVY_GL_BACKEND: 'angle_sdl2'
  KIVY_SPLIT_EXAMPLES: 1
  SETUPTOOLS_USE_DISTUTILS: local
  UV_SYSTEM_PYTHON: "1"
  UV_FIND_LINKS: wheelhouse

jobs:
  unit_test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.14', '3.15']
        arch: ['x64']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python }} on ${{ matrix.arch }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.6"
    - name: Prepare kivy_deps wheels
      run: python tools/repack_kivy_deps_wheels.py
    - name: Install Kivy
      run: |
        . .\.ci\windows_ci.ps1
        Install-kivy
    - name: Test Kivy
      run: |
        . .\.ci\windows_ci.ps1
        Test-kivy
    - name: Test Kivy benchmarks
      run: |
        . .\.ci\windows_ci.ps1
        Test-kivy-benchmark
    - name: Upload benchmarks as artifact
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks-windows-unittests-python-${{ matrix.python }}-${{ matrix.arch }}
        path: .benchmarks-kivy
