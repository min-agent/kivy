[build-system]
requires = [
    "setuptools>=80,<85",
    "wheel>=0.45",
    "packaging>=25",
    "cython>=3.3,<4",
    'kivy_deps.gstreamer_dev~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2_dev~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew_dev~=0.3.1; sys_platform == "win32"',
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew~=0.3.1; sys_platform == "win32"',
]
build-backend = "setuptools.build_meta"

[project]
name = "Kivy"
dynamic = ["version"]
description = "An open-source Python framework for developing GUI apps that work cross-platform, including desktop, mobile and embedded platforms."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kivy Team and other contributors", email = "kivy-dev@googlegroups.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Artistic Software",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Sound/Audio :: Players :: MP3",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "Kivy-Garden>=0.1.4",
    "docutils",
    "pygments",
    "requests",
    "filetype",
    'kivy_deps.angle~=0.5.0; sys_platform == "win32"',
    'kivy_deps.sdl2~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew~=0.3.1; sys_platform == "win32"',
    'pywin32>=312; sys_platform == "win32"',
]

[project.urls]
Homepage = "http://kivy.org"
Source = "https://github.com/kivy/kivy"
Documentation = "https://kivy.org/doc/stable/"
"Bug Reports" = "https://github.com/kivy/kivy/issues"

[project.optional-dependencies]
tuio = ["oscpy"]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4",
    "pytest-benchmark>=5",
    "pyinstaller>=6.16",
    "sphinx>=9.2",
    "sphinxcontrib-jquery>=4.1",
    'kivy_deps.gstreamer_dev~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2_dev~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew_dev~=0.3.1; sys_platform == "win32"',
    "ruff>=0.17.3,<1.0.0",
    "pre-commit>=4",
    "responses>=0.25",
]
base = ["pillow>=11.3"]
media = [
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'ffpyplayer>=4.5.4; (sys_platform == "linux" or sys_platform == "darwin") and python_version < "3.15"',
]
full = [
    "pillow>=11.3,<13",
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'ffpyplayer>=4.5.4; (sys_platform == "linux" or sys_platform == "darwin") and python_version < "3.15"',
]
gstreamer = ['kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"']
angle = ['kivy_deps.angle~=0.5.0; sys_platform == "win32"']
sdl2 = ['kivy_deps.sdl2~=0.8.0; sys_platform == "win32"']
glew = ['kivy_deps.glew~=0.3.1; sys_platform == "win32"']

[dependency-groups]
ci = [
    "cibuildwheel>=4.3",
    "ruff>=0.17.3,<1.0.0",
]
docs = [
    "sphinx>=9.2",
    "sphinxcontrib-jquery>=4.1",
]

[tool.uv]
find-links = ["wheelhouse"]

[tool.kivy]
cython_min = "3.3.0"
cython_max = "3.3.0"
cython_exclude = ""
python_versions = "3.14 - 3.15"

[tool.ruff]
target-version = "py315"
exclude = [
    "__pycache__",
    ".tox",
    ".git/",
    "doc/",
    "build/",
    ".eggs/",
    "venv/",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-ignore = ["E402", "E722", "E731", "E741", "F401", "F841"]

[tool.coverage.run]
parallel = true
branch = true
omit = ["*/pyinstaller/*_widget/*"]
plugins = ["kivy.tools.coverage"]
concurrency = ["thread", "multiprocessing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--benchmark-skip --benchmark-warmup=on --benchmark-warmup-iterations=5 --benchmark-disable-gc --benchmark-name=short --benchmark-sort=mean --benchmark-group-by=fullfunc --benchmark-storage=.benchmarks-kivy --benchmark-save=kivy"
markers = [
    "logmodepython: mark a test for the logger module in python mode",
    "logmodemixed: mark a test for the logger module in mixed mode",
    "incremental: mark a test as incremental",
]
