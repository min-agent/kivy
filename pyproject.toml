[build-system]
requires = [
    "setuptools~=69.2.0",
    "wheel~=0.44.0",
    "packaging~=24.0",
    "cython>=0.29.1,<=3.0.11",
    'tomli>=1.1.0; python_version < "3.11"',
    'kivy_deps.gstreamer_dev~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2_dev~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew_dev~=0.3.1; sys_platform == "win32"',
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew~=0.3.1; sys_platform == "win32"',
]
build-backend = "setuptools.build_meta"

[project]
name = "Kivy"
dynamic = ["version"]
description = "An open-source Python framework for developing GUI apps that work cross-platform, including desktop, mobile and embedded platforms."
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Kivy Team and other contributors", email = "kivy-dev@googlegroups.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Sound/Audio :: Players :: MP3",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "Kivy-Garden>=0.1.4",
    "docutils",
    "pygments",
    "requests",
    "filetype",
    'kivy_deps.angle~=0.4.0; sys_platform == "win32"',
    'kivy_deps.sdl2~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew~=0.3.1; sys_platform == "win32"',
    'pypiwin32; sys_platform == "win32"',
]

[project.urls]
Homepage = "http://kivy.org"
Source = "https://github.com/kivy/kivy"
Documentation = "https://kivy.org/doc/stable/"
"Bug Reports" = "https://github.com/kivy/kivy/issues"

[project.optional-dependencies]
tuio = ["oscpy"]
dev = [
    "pytest>=3.6",
    "pytest-cov",
    "pytest_asyncio!=0.11.0",
    "pytest-timeout",
    "pytest-benchmark",
    "pyinstaller",
    "sphinx~=6.2.1",
    "sphinxcontrib-jquery~=4.1",
    'kivy_deps.gstreamer_dev~=0.3.3; sys_platform == "win32"',
    'kivy_deps.sdl2_dev~=0.8.0; sys_platform == "win32"',
    'kivy_deps.glew_dev~=0.3.1; sys_platform == "win32"',
    "ruff>=0.17.3,<1.0.0",
    "pre-commit",
    "responses",
]
base = ["pillow>=9.5.0,<11"]
media = [
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'ffpyplayer; sys_platform == "linux" or sys_platform == "darwin"',
]
full = [
    "pillow>=9.5.0,<11",
    'kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"',
    'ffpyplayer; sys_platform == "linux" or sys_platform == "darwin"',
]
gstreamer = ['kivy_deps.gstreamer~=0.3.3; sys_platform == "win32"']
angle = ['kivy_deps.angle~=0.4.0; sys_platform == "win32"']
sdl2 = ['kivy_deps.sdl2~=0.8.0; sys_platform == "win32"']
glew = ['kivy_deps.glew~=0.3.1; sys_platform == "win32"']

[dependency-groups]
ci = [
    "cibuildwheel~=2.21.1",
    "ruff>=0.17.3,<1.0.0",
]
docs = [
    "sphinx~=6.2.1",
    "sphinxcontrib-jquery~=4.1",
]

[tool.kivy]
cython_min = "0.29.1"
cython_max = "3.0.11"
cython_exclude = ""
python_versions = "3.8 - 3.13"

[tool.ruff]
target-version = "py38"
exclude = [
    "__pycache__",
    ".tox",
    ".git/",
    "doc/",
    "build/",
    ".eggs/",
    "venv/",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-ignore = ["E402", "E722", "E731", "E741", "F401", "F841"]

[tool.coverage.run]
parallel = true
branch = true
omit = ["*/pyinstaller/*_widget/*"]
plugins = ["kivy.tools.coverage"]
concurrency = ["thread", "multiprocessing"]

[tool.pytest.ini_options]
addopts = "--benchmark-skip --benchmark-warmup=on --benchmark-warmup-iterations=5 --benchmark-disable-gc --benchmark-name=short --benchmark-sort=mean --benchmark-group-by=fullfunc --benchmark-storage=.benchmarks-kivy --benchmark-save=kivy"
markers = [
    "logmodepython: mark a test for the logger module in python mode",
    "logmodemixed: mark a test for the logger module in mixed mode",
    "incremental: mark a test as incremental",
]
